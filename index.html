<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>오늘의 방명록</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/home.css" />
  <link rel="stylesheet" href="./css/write.css" />
  <link rel="stylesheet" href="./css/list.css" />
  <link rel="stylesheet" href="./css/modal.css" />
</head>

<body>
  <main id="app">
    <!-- 첫 화면 -->
    <section class="page active" id="homePage">
      <p class="side-text left">Moonlight Guestbook</p>
      <p class="side-text right">leave your day here</p>

      <section class="window">
        <div class="sun-moon">
          <div class="moon-cover"></div>
        </div>

        <span class="star star-one">✦</span>
        <span class="star star-two">✦</span>

        <div class="hill"></div>

        <div class="home-text">
          <h1>Guestbook of Today</h1>
          <p>시간에 따라 물드는 작은 기록 공간</p>

          <div class="home-buttons">
            <button type="button" class="main-btn" id="goWriteBtn">
              기록 남기기
            </button>

            <button type="button" class="view-btn" id="goListBtn">
              기록 보기
            </button>
          </div>
        </div>
      </section>
    </section>

    <!-- 기록 작성 화면 -->
    <section class="page" id="writePage">
      <p class="side-text left" id="writeSideLeft">moonlight note</p>
      <p class="side-text right" id="writeSideRight">leave your day here</p>

      <div class="write-sun-moon">
        <div class="write-moon-cover"></div>
      </div>

      <span class="star write-star-one">✦</span>
      <span class="star write-star-two">✦</span>
      <span class="star write-star-three">✦</span>

      <section class="write-card">
        <button type="button" class="close-btn" id="closeWriteBtn">×</button>

        <h2 id="writeTitle">💫오늘의 기록 남기기💫</h2>

        <form id="writeForm">
          <div class="input-row">
            <label>
              <span>작성자*</span>
              <input
                type="text"
                id="writerInput"
                placeholder="닉네임을 입력하세요"
                required
              />
            </label>

            <label>
              <span>비밀번호*</span>
              <input
                type="password"
                id="passwordInput"
                placeholder="게시글 비밀번호(4자리)"
                maxlength="4"
                required
              />
            </label>
          </div>

          <label>
            <span>제목*</span>
            <input
              type="text"
              id="titleInput"
              placeholder="제목을 입력하세요"
              required
            />
          </label>

          <label>
            <span>내용*</span>
            <textarea
              id="contentInput"
              placeholder="오늘의 이야기를 적어주세요"
              required
            ></textarea>
          </label>

          <div class="button-area">
            <button type="submit" class="submit-btn">기록 남기기</button>
          </div>
        </form>
      </section>
    </section>

    <!-- 목록 화면 -->
    <section class="page" id="listPage">
      <section class="list-box">
        <header class="list-header">
          <div>
            <p class="small-en">Guestbook</p>
            <h2 id="listTitle">방명록 기록🌙</h2>
          </div>

          <div class="list-top">
            <input type="text" id="searchInput" placeholder="검색" />
            <button type="button" id="backHomeBtn">처음으로</button>
            <button type="button" id="writeAgainBtn">기록 남기기</button>
          </div>
        </header>

        <div class="sort-buttons">
          <button type="button" class="sort-btn active" id="latestBtn">
            최신순
          </button>

          <button type="button" class="sort-btn" id="recommendBtn">
            추천글
          </button>
        </div>

        <div class="post-grid" id="postGrid"></div>
      </section>
    </section>

    <!-- 모달 배경 -->
    <div class="modal-bg hide" id="modalBg"></div>

    <!-- 자세히 보기 모달 -->
    <section class="modal hide" id="detailModal">
      <button type="button" class="close-btn modal-close">×</button>
      <div id="detailContent"></div>
    </section>

    <!-- 수정 모달 -->
    <section class="modal hide" id="editModal">
      <button type="button" class="close-btn modal-close">×</button>

      <p class="modal-small-title">New Edit</p>
      <h2>기록 수정하기⭐</h2>

      <form id="editForm">
        <input type="hidden" id="editIdInput" />

        <label>
          <span>비밀번호 확인*</span>
          <input
            type="password"
            id="editPasswordInput"
            placeholder="게시글 비밀번호(4자리)"
            maxlength="4"
            required
          />
        </label>

        <label>
          <span>제목*</span>
          <input
            type="text"
            id="editTitleInput"
            placeholder="제목을 입력하세요"
            required
          />
        </label>

        <label>
          <span>내용*</span>
          <textarea
            id="editContentInput"
            placeholder="내용을 입력하세요"
            required
          ></textarea>
        </label>

        <div class="button-area two">
          <button type="submit" class="submit-btn">수정 완료</button>
        </div>
      </form>
    </section>

    <!-- 댓글 작성 모달 -->
    <section class="modal hide" id="commentModal">
      <button type="button" class="close-btn modal-close">×</button>

      <p class="modal-small-title">New Comment</p>
      <h2>댓글 작성하기⭐</h2>

      <form id="commentForm">
        <input type="hidden" id="commentPostIdInput" />

        <label>
          <span>작성자 닉네임*</span>
          <input
            type="text"
            id="commentWriterInput"
            placeholder="닉네임을 입력하세요"
            required
          />
        </label>

        <label>
          <span>비밀번호*</span>
          <input
            type="password"
            id="commentPasswordInput"
            placeholder="댓글 비밀번호(4자리)"
            maxlength="4"
            required
          />
        </label>

        <label>
          <span>댓글 내용*</span>
          <textarea
            id="commentContentInput"
            placeholder="댓글 내용을 입력하세요"
            required
          ></textarea>
        </label>

        <div class="button-area two">
          <button type="submit" class="submit-btn">댓글 등록</button>
        </div>
      </form>
    </section>

    <!-- 삭제 모달 -->
    <section class="modal small-modal hide" id="deleteModal">
      <button type="button" class="close-btn modal-close">×</button>

      <div class="warning-icon">!</div>

      <h2>기록을 삭제할까요?</h2>

      <p class="modal-text">
        삭제하려면 게시글 비밀번호를 입력하세요.<br />
        삭제된 기록은 다시 되돌릴 수 없어요.
      </p>

      <form id="deleteForm">
        <input type="hidden" id="deleteIdInput" />

        <label>
          <span>비밀번호 확인*</span>
          <input
            type="password"
            id="deletePasswordInput"
            placeholder="게시글 비밀번호(4자리)"
            maxlength="4"
            required
          />
        </label>

        <div class="button-area two">
          <button type="submit" class="delete-btn">삭제하기</button>
        </div>
      </form>
    </section>
  </main>

  <script src="./js/data.js"></script>
  <script src="./js/theme.js"></script>
  <script src="./js/render.js"></script>
  <script src="./js/button.js"></script>
</body>
</html>
